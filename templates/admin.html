<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curator — Admin console</title>
  <!-- No inline styles/scripts: CSP is default-src 'none' with script-src/style-src 'self'. -->
  <link rel="stylesheet" href="/admin/app.css">
</head>
<body>
  <header class="topbar">
    <h1>Curator admin</h1>
    <button id="logout" type="button">Log out</button>
  </header>

  <p id="error" class="error" hidden></p>

  <!-- Enrollment window -->
  <section id="window-section">
    <h2>Enrollment window</h2>
    <p id="window-status">Loading…</p>
    <div class="actions">
      <button id="open-window" type="button">Open window</button>
      <button id="close-window" type="button">Close window</button>
    </div>
    <!-- While the window is open, a browser that submits this code in its extension
         settings enrols itself under the id typed there. There is no approval step and
         so no pending list: a refused attempt (name taken, bad name, wrong code) shows
         its reason in that browser's settings and is counted in /metrics. -->
    <p class="hint">A browser enrols itself with this code, under the name set in its extension settings. Close the window when you are done.</p>
  </section>

  <!-- Instances -->
  <section id="instances-section">
    <h2>Instances</h2>
    <table>
      <thead>
        <tr>
          <th>id</th>
          <th>status</th>
          <th>connected</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="instances-body"></tbody>
    </table>
    <p id="instances-empty" hidden>No instances.</p>
  </section>

  <script src="/admin/app.js"></script>
</body>
</html>
