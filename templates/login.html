<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curator — вход</title>
  <link rel="stylesheet" href="/admin/app.css">
</head>
<body>
  <div class="page">
    <header class="topbar"><h1>Curator</h1></header>
    <!-- One form, centred. The page is PUBLIC (src/api/admin_page.py): it carries no state,
         no revision stamp and nothing to fetch. -->
    <main class="login">
      <section class="card login-card">
        <p class="card-title">Вход</p>
        <!-- The form posts same-origin (form-action 'self'); login.js intercepts and uses
             fetch so it can redirect to /admin on success. -->
        <form id="login-form" method="post" action="/admin/login" autocomplete="off">
          <label class="field-label" for="token">Токен администратора</label>
          <input id="token" class="field-input" name="token" type="password" required autofocus>
          <button class="btn" type="submit">Войти</button>
        </form>
        <p id="error" class="inline-error" hidden></p>
      </section>
    </main>
  </div>
  <script src="/admin/login.js"></script>
</body>
</html>
