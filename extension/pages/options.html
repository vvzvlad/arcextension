<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>arcextension — Options</title>
    <!--
      Styling lives in pages/ui.css, shared with the popup. An external stylesheet is
      fine under the extension_pages CSP (`script-src 'self'` governs scripts, not
      styles) and it loads from the bundle, never from the network.
    -->
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="ui-options">
    <!--
      Options page (§7, §12). It carries the enrollment settings — the service address,
      the NAME this browser enrols under (which becomes its instance id, so it is
      validated here against the same charset the service enforces), the ~10-min window
      code the operator reads off /admin, and a submit-enrollment action — plus the
      execute_js opt-in (§12), the "stop" button for the most dangerous operation.
      Enrolment is ONE step: submitting a valid code into an open window enrols this
      browser immediately, and a refusal shows its reason right here (this is the only
      place a human sees it). All settings live in chrome.storage.local (per-profile;
      NEVER in the bundle) — the shared token is gone. The script is external
      (options.js) because the extension_pages CSP is `script-src 'self'`.

      WHAT THE RULES OF THIS FORM ARE IS NOT WRITTEN HERE ANYMORE. The address schemes
      and the instance-name charset used to be two paragraphs of prose above the fields;
      they are now shown as a refusal AT the field that broke them (a red border and one
      red line under it, written by options.js from the very gate that decides whether
      the value may be stored). Prose that describes a check nobody reads until it fires
      is worse than the check saying it itself.

      The ids are the contract with options.js: enroll-state, service-address,
      browser-name, enroll-code, submit-enroll, allow-execute-js, status — plus the
      "<field>-error" line each input names in aria-describedby.
    -->
    <main class="ui-page">
      <h1 class="ui-title">arcextension options</h1>

      <section class="ui-card">
        <h2 class="ui-card-title">Enrollment</h2>

        <p class="ui-pill-row">
          <span class="ui-pill" id="enroll-state" data-role="enroll-state" role="status" aria-live="polite">…</span>
        </p>

        <div class="ui-field">
          <label class="ui-label" for="service-address">Service address</label>
          <input
            class="ui-input"
            type="text"
            id="service-address"
            data-role="service-address"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            placeholder="curator.example"
            aria-describedby="service-address-error"
          />
          <p class="ui-error" id="service-address-error" role="status" aria-live="polite"></p>
        </div>

        <div class="ui-field">
          <label class="ui-label" for="browser-name">Browser name</label>
          <input
            class="ui-input"
            type="text"
            id="browser-name"
            data-role="browser-name"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            placeholder="work-laptop"
            aria-describedby="browser-name-error"
          />
          <p class="ui-error" id="browser-name-error" role="status" aria-live="polite"></p>
        </div>

        <div class="ui-field">
          <label class="ui-label" for="enroll-code">Enrollment code</label>
          <input
            class="ui-input"
            type="text"
            id="enroll-code"
            data-role="enroll-code"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            placeholder="from /admin, valid ~10 min"
            aria-describedby="enroll-code-error"
          />
          <p class="ui-error" id="enroll-code-error" role="status" aria-live="polite"></p>
        </div>

        <button class="ui-button" type="button" id="submit-enroll" data-role="submit-enroll">
          Submit enrollment
        </button>
      </section>

      <!--
        execute_js (§12) is one checkbox in the page flow, deliberately without a card,
        a warning stripe or a paragraph of its own: the danger is in what it ALLOWS, and
        the switch that allows it is off by default and refuses every execute_js with
        `js_disabled` while it stays off.
      -->
      <label class="ui-checkbox" for="allow-execute-js">
        <input type="checkbox" id="allow-execute-js" />
        <span>Allow <code>execute_js</code> on this copy</span>
      </label>

      <!--
        The debugger opt-in (§12). Unlike execute_js — whose danger is entirely in what
        the code does — this one has a cost the owner PAYS EVEN WHEN NOTHING GOES WRONG,
        and that cost is stated here rather than left to be discovered: attaching the
        debugger puts the browser's "идёт отладка" bar across the top of the window for as
        long as it stays attached, and the attached state is trivially detectable by
        anti-bot systems, which is how a logged-in session gets challenged or blocked.
        Nothing reads this switch yet; it is reported in `hello` so an agent can see what
        this copy allows before it asks.
      -->
      <label class="ui-checkbox" for="allow-debugger">
        <input type="checkbox" id="allow-debugger" />
        <span>
          Allow the <code>debugger</code> on this copy — shows the browser's
          «идёт отладка» bar while attached, and is detectable by anti-bot systems
        </span>
      </label>

      <p class="ui-status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js" type="module"></script>
  </body>
</html>
