<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>arcextension — Rule from this tab</title>
  </head>
  <body>
    <!--
      "Rule from this tab" (§8, §10): a one-click way to add a rule
      `<origin>/*` → <this instance> with a server-side impact preview and a Save
      button. This is the cold-start path — an empty rules table disables curation
      entirely (§8), so filling it must be effortless. The script is external
      (popup.js) because the extension_pages CSP is `script-src 'self'`.
    -->
    <main style="min-width: 20rem; font: 14px system-ui, sans-serif">
      <h1 style="font-size: 1rem">Add a rule from this tab</h1>
      <p>
        Route <code id="origin">…</code> to
        <strong id="target">…</strong>.
      </p>
      <p>Pattern: <code id="pattern">…</code></p>
      <p id="impact" role="status" aria-live="polite">Loading preview…</p>
      <button id="save" disabled>Save rule</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
