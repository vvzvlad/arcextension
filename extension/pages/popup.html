<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>arcextension — Rule from this tab</title>
    <!--
      Styling lives in pages/ui.css, shared with the options page. An external
      stylesheet is fine under the extension_pages CSP (`script-src 'self'` governs
      scripts, not styles) and it loads from the bundle, never from the network.
    -->
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="ui-popup">
    <!--
      "Rule from this tab" (§8, §10): the fast way to add a rule for the site you are
      looking at. Both halves of the rule are chosen HERE — the host pattern (prefilled
      from the tab, editable) and the target browser (defaults to this one, picked from
      the fleet /api/state lists) — because the question this popup answers is "where
      does this site belong", and answering half of it meant filing a rule and then
      going somewhere else to edit it. The impact preview is recomputed by the SERVER
      for whatever is in the form, and saving goes through the §8 two-step confirm gate.
      This is also the cold-start path — an empty rules table disables curation entirely
      (§8), so filling it must be effortless. The script is external (popup.js) because
      the extension_pages CSP is `script-src 'self'`.

      The ids are the contract with popup.js: origin, pattern, target, impact, save,
      status (plus data-role on the two inputs). Nothing here may be renamed alone.
    -->
    <main class="ui-page">
      <h1 class="ui-title">Add a rule from this tab</h1>
      <p class="ui-subtitle">This tab: <code id="origin">…</code></p>

      <div class="ui-field">
        <label class="ui-label" for="pattern">Tabs matching</label>
        <input
          class="ui-input"
          type="text"
          id="pattern"
          data-role="pattern"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          placeholder="example.com[:port]"
          aria-describedby="hint"
        />
        <!--
          One line, not a paragraph. The matcher's full semantics (src/rules/matcher.py,
          §8: `<hostPattern>[:port]`, fullmatch against the WHOLE host, path ignored, a
          missing port matches any port) used to be spelled out here, and the one case
          people actually get wrong — a rule that matches more tabs than expected — is
          answered better by the impact block below, which shows what THIS pattern would
          really do. A refused pattern comes back from the server with its own reason
          (422, shown verbatim in the status row), so the hint carries only what you need
          before typing.
        -->
        <p class="ui-hint" id="hint">
          Whole host name, path ignored. <code>*</code> = any characters.
        </p>
      </div>

      <div class="ui-field">
        <label class="ui-label" for="target">move to</label>
        <select class="ui-select" id="target" data-role="target"></select>
      </div>

      <!--
        The server's impact preview, written by popup.js as ONE multi-line string
        (textContent — every server string reaches the DOM that way). `white-space:
        pre-line` in ui.css is what keeps those line breaks; the accent bar is not red
        because "0 tabs" is a normal answer here, not a warning.
      -->
      <p class="ui-impact" id="impact" role="status" aria-live="polite">Loading preview…</p>

      <button class="ui-button" id="save" disabled>Save rule</button>
      <p class="ui-status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
