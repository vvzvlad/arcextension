name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]

permissions:
  contents: read   # checkout
  packages: write  # push image to ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests
      env:
        METRICS_TOKEN: test-metrics-token   # required ENV so importing settings works
        ADMIN_TOKEN: test-admin-token       # required + must differ from METRICS_TOKEN (§13)
      run: pytest --tb=short -q

    # The alert rules (§12) live in this job, not a job of their own, so `build:
    # needs: test` keeps gating the image on them as well: a rule file that no longer
    # parses leaves the deployed curator with NO alerts at all, which is a worse state
    # to ship than a failed build. promtool is not a Python dep and cannot come from
    # requirements-dev.txt, so it is fetched here — pinned to the Prometheus LTS line,
    # because an unpinned "latest" makes the meaning of a green run drift.
    - name: Install promtool
      env:
        PROMETHEUS_VERSION: "3.5.5"   # LTS
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" --strip-components=1 \
              "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
        "$HOME/.local/bin/promtool" --version
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # Through `make alerts`, never a hand-copied promtool line: the target IS the
    # definition of "validated" (schema check + the fire/stay-quiet cases in
    # deploy/alerts_test.yml), and a duplicate here would drift from what an operator
    # runs locally. CI=true flips the target's "promtool missing -> skip and exit 0"
    # branch into a hard failure, so a runner that failed to fetch the binary cannot
    # report a skip as a pass. (GitHub already exports CI=true; set explicitly so the
    # dependency is visible rather than inherited.)
    - name: Validate the Prometheus alert rules
      env:
        CI: "true"
      run: make alerts

  # Extension (MV3) tests: independent Node/vitest toolchain under extension/.
  # Kept separate from the Python `test` job and NOT a dependency of `build`
  # (the image ships the Python service only). Runs on the same triggers as the
  # rest of this workflow (push to main/develop + workflow_dispatch); it does NOT
  # block the image build. Add a `pull_request:` trigger if PR-level gating is
  # wanted (that would apply to the whole workflow, matching the repo's convention).
  extension-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install and test the extension
      working-directory: extension
      run: |
        npm ci || npm install
        npm test

  # Startpage (Vue 3 + Vite) tests: build INTO extension/startpage, then the three
  # §10 build gates and the vitest suite (the render smoke test loads the built
  # bundle, so the build must run first). Independent of the Python image build.
  startpage-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Build, gate and test the startpage
      working-directory: startpage
      run: |
        npm ci || npm install
        npm run build
        npm run gates
        npm test

    # The build writes into the TRACKED extension/startpage. A fresh build must match
    # what is committed — otherwise editing startpage/src/* without rebuilding ships a
    # stale newtab and no gate above catches it (the gates run over whatever was built,
    # not over the committed artifact). The Vite build is byte-reproducible on the
    # pinned toolchain (verified), so comparing the tree against HEAD is the gate; a
    # drift means "run `npm --prefix startpage run build` and commit the result".
    #
    # `git status --porcelain`, NOT `git diff --exit-code`: THE CHUNK FILENAME CARRIES A
    # CONTENT HASH (assets/index-<hash>.js), so a changed bundle is never a modification
    # of a tracked file — it is a DELETED old chunk plus a brand new UNTRACKED one. `git
    # diff` does not look at untracked files at all, so it would report the new chunk as
    # nothing and pass; a forgotten `git add` would then ship an index.html pointing at a
    # chunk that is not in the repo — an empty newtab on a green CI run. Do not
    # "simplify" this back to git diff.
    - name: Fail if the committed startpage bundle is stale (drift from a fresh build)
      run: |
        if [ -n "$(git status --porcelain -- extension/startpage)" ]; then
          git status --porcelain -- extension/startpage
          echo "::error::extension/startpage is out of date vs a fresh build — run 'npm --prefix startpage run build' and commit extension/startpage."
          exit 1
        fi

  build:
    runs-on: ubuntu-latest
    needs: test                          # no green tests → no image is built
    steps:
    - uses: actions/checkout@v7

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute image tags
      id: tags
      # develop -> :develop, and that is the tag watchtower deploys today.
      # main -> :latest + :<sha> is reserved for releases; the branch does not exist yet.
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "tags=ghcr.io/${{ github.repository }}:latest ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
        else
          echo "tags=ghcr.io/${{ github.repository }}:develop" >> "$GITHUB_OUTPUT"
        fi

    # BUILD_REVISION is the ONE thing the deployed container cannot work out for itself
    # (no git, no repo inside the image), so it is stamped here, from the commit this run
    # is building. The image then reports it on /healthz and in the /admin console, which
    # is what makes "the code is broken" distinguishable from "watchtower has not pulled
    # the new image yet" — the two failures look identical otherwise. The `:develop` tag is
    # reused on every push, so the tag itself identifies nothing.
    - name: Build the Docker image
      run: |
        tag_args=""
        for tag in ${{ steps.tags.outputs.tags }}; do tag_args="$tag_args --tag $tag"; done
        docker build . --file Dockerfile \
          --build-arg BUILD_REVISION=${{ github.sha }} $tag_args

    - name: Push Docker images
      run: |
        for tag in ${{ steps.tags.outputs.tags }}; do docker push "$tag"; done
