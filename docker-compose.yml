# Deploy template. Pull the prebuilt image from ghcr.io — do NOT build on prod.
# Values below are PLACEHOLDERS (XXX), not real secrets.
#
# This is the WEB-SERVICE variant (published via Traefik). For a polling bot with
# no inbound port, drop `networks`, the Traefik labels and the healthcheck.

volumes:
  curator:
  # Backup copies mount on a SEPARATE volume from the DB (§12): a full DB volume
  # must not also swallow the nightly VACUUM INTO copies, and a copy volume can be
  # snapshotted / off-boxed independently.
  curator_backups:

networks:
  docker_main_net:
    external: true

services:
  curator:
    image: ghcr.io/vvzvlad/arcextension:latest
    container_name: curator
    restart: always
    # The app runs as non-root user `app` (uid 1000): the entrypoint starts as
    # root, chowns /app/data and drops privileges via gosu. Setting a
    # `user: "UID:GID"` override here makes the entrypoint skip the chown —
    # the volume must then already be owned by that uid.
    security_opt:
      - no-new-privileges:true   # forbids privilege escalation via setuid binaries; compatible with gosu (it only drops privileges)
    # Optional hardening. The cap_add list is the minimum the root entrypoint
    # needs (chown -R the volume + gosu setuid/setgid drop):
    # cap_drop: [ALL]
    # cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    volumes:
      - curator:/app/data              # all mutable state survives restart/update
      - curator_backups:/app/backups   # backup copies on a SEPARATE volume (§12)
    environment:
      # EXT_TOKEN opens /ext, /api/* and /mcp; METRICS_TOKEN is read-only for
      # /metrics. Both are REQUIRED — an empty value fails startup (§4).
      EXT_TOKEN: XXX
      METRICS_TOKEN: XXX
      # Backups live on the separate curator_backups volume above, NOT under
      # /app/data. The entrypoint mkdir+chowns this path before dropping to `app`.
      BACKUP_DIR: /app/backups
      # Real chrome-extension://<id> origins, comma-separated. MUST match the
      # installed extension id(s): a mismatch silently breaks the startpage's
      # /api/* fetch (CORS preflight) while /ext still connects (§12). Empty here
      # closes cross-origin /api/* entirely (secure default, not '*').
      EXT_ALLOWED_ORIGINS: chrome-extension://XXX
      TZ: Europe/Moscow
    networks:
      - docker_main_net
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      traefik.enable: "true"
      traefik.http.routers.curator.rule: Host(`curator.example.com`)
      traefik.http.services.curator.loadBalancer.server.port: 8000
      traefik.http.routers.curator.entrypoints: websecure
      traefik.http.routers.curator.tls: "true"
      traefik.http.routers.curator.tls.certresolver: letsEncrypt
      com.centurylinklabs.watchtower.enable: "true"   # auto-update the image
    healthcheck:
      # Short interval + start_period are REQUIRED behind Traefik: Traefik does not
      # route to a container while its health is starting/unhealthy, so interval:30m
      # with no start_period leaves it unrouted for ~30 min (default cert + 404).
      test: ["CMD", "curl", "-s", "-f", "-o", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
