# Deploy template. Pull the prebuilt image from the Gitea registry — do NOT build on prod.
# Values below are PLACEHOLDERS (XXX), not real secrets.
#
# This is the WEB-SERVICE variant (published via Traefik). For a polling bot with
# no inbound port, drop `networks`, the Traefik labels and the healthcheck.

volumes:
  # ONE volume for all mutable state (project convention: "all mutable state goes
  # under data/"). Inside it: the DB (/app/data/curator.db) and the nightly backup
  # copies (/app/data/backups). What that costs, spelled out in deploy/DEPLOY.md §5:
  # backups share free space with the DB — `curator-backup-stale` is the alert that
  # says the nightly copy stopped landing.
  curator:

networks:
  docker_main_net:
    external: true

services:
  curator:
    # `:develop` is the deployed tag — CI publishes it on every push to `develop`,
    # and the watchtower label below auto-updates the container from it. `main` is
    # reserved for releases (`:latest` + `:<sha>`) but does not exist yet, so
    # pinning `:latest` here would resolve to an image that was never published.
    #
    # The registry is the GITEA one, matching where the pipeline actually pushes
    # (.gitea/workflows/image-check-publish.yml). It used to say ghcr.io, left over
    # from the GitHub Actions era; nothing publishes there any more, so the stale
    # address read as "watchtower will never see a new image".
    #
    # ⚠️ This file is a REFERENCE, not the deployed stack: the live container is
    # configured in Portainer and carries its own image address. Editing this line
    # does not redeploy anything — change it in Portainer too, or it drifts again.
    # The org is `projects`, not `vvzvlad`: the workflow builds the path from
    # `github.repository`, which is `projects/tabscurator`, and the live container
    # on nebula pulls exactly that. The `vvzvlad/...` spelling here published
    # nowhere and matched nothing.
    image: gitea.vvzvlad.xyz/projects/tabscurator:develop
    container_name: curator
    restart: always
    # The app runs as non-root user `app` (uid 1000): the entrypoint starts as
    # root, chowns /app/data and drops privileges via gosu. Setting a `user: "UID:GID"`
    # override here makes the entrypoint skip the chown (the volume must then already
    # be owned by that uid).
    security_opt:
      - no-new-privileges:true   # forbids privilege escalation via setuid binaries; compatible with gosu (it only drops privileges)
    # Optional hardening. The cap_add list is the minimum the root entrypoint
    # needs (chown -R the volume + gosu setuid/setgid drop):
    # cap_drop: [ALL]
    # cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    volumes:
      - curator:/app/data              # all mutable state survives restart/update
    environment:
      # Under enrollment (§13) there is NO shared /ext token: METRICS_TOKEN is read-only
      # for /metrics; ADMIN_TOKEN opens /admin (enrollment), /api/* (human/agent caller)
      # and /mcp. Both are REQUIRED — an empty value fails startup (§4). ADMIN_TOKEN must
      # DIFFER from METRICS_TOKEN. Instances authenticate by a per-install secret entered
      # during enrollment, not by any value set here.
      METRICS_TOKEN: YYY
      ADMIN_TOKEN: ZZZ
      # Backups live INSIDE the single volume, under the DB directory. They therefore
      # share free space with the DB — `curator-backup-stale` is what tells you the
      # nightly copy stopped landing (DEPLOY.md §5).
      BACKUP_DIR: /app/data/backups
      # Restore-from-backup detection was replaced by the per-pass action threshold
      # (MAX_ACTIONS_PER_PASS, §7): whatever a restore breaks shows up as an oversized
      # plan, which defers behind one confirming click. No marker, no extra env.
      TZ: Europe/Moscow
    networks:
      - docker_main_net
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      traefik.enable: "true"
      traefik.http.routers.curator.rule: Host(`curator.example.com`)
      traefik.http.services.curator.loadBalancer.server.port: 8000
      traefik.http.routers.curator.entrypoints: websecure
      traefik.http.routers.curator.tls: "true"
      traefik.http.routers.curator.tls.certresolver: letsEncrypt
      com.centurylinklabs.watchtower.enable: "true"   # auto-update the image
    healthcheck:
      # Short interval + start_period are REQUIRED behind Traefik: Traefik does not
      # route to a container while its health is starting/unhealthy, so interval:30m
      # with no start_period leaves it unrouted for ~30 min (default cert + 404).
      test: ["CMD", "curl", "-s", "-f", "-o", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
