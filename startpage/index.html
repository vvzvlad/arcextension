<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Новая вкладка</title>
    <!--
      Page CSS is inline here (NOT an SFC <style> block) on purpose: it keeps the
      built bundle pure JS so the render smoke test can import the entry without a
      CSS asset, and inline styles are allowed under the extension_pages CSP
      (`script-src 'self'` governs scripts, not styles). All assets stay local.
    -->
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      #app { max-width: 900px; margin: 0 auto; padding: 24px 20px 64px; }
      .sp-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
      .sp-title { font-size: 20px; font-weight: 600; }
      .sp-sub { opacity: 0.6; font-size: 13px; }
      .sp-search {
        width: 100%; padding: 10px 12px; font-size: 15px;
        border: 1px solid rgba(128,128,128,0.4); border-radius: 8px;
        background: Field; color: FieldText; margin-bottom: 20px;
      }
      .sp-group { margin-bottom: 22px; }
      .sp-group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .sp-group-name { font-weight: 600; }
      .sp-cache-note { font-size: 12px; opacity: 0.6; }
      .sp-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
      .sp-item {
        display: flex; align-items: center; gap: 8px; padding: 6px 8px;
        border-radius: 6px; cursor: pointer;
      }
      .sp-item:hover { background: rgba(128,128,128,0.12); }
      .sp-item.is-inactive { cursor: default; opacity: 0.55; }
      .sp-item-title { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sp-item-url { opacity: 0.5; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sp-fav { width: 16px; height: 16px; flex: 0 0 16px; }
      .sp-empty { opacity: 0.5; font-size: 13px; padding: 4px 8px; }
      .sp-ql-add { display: flex; gap: 8px; margin-top: 8px; }
      .sp-ql-add input { flex: 1; padding: 6px 8px; border: 1px solid rgba(128,128,128,0.4); border-radius: 6px; background: Field; color: FieldText; }
      .sp-btn { padding: 6px 10px; border: 1px solid rgba(128,128,128,0.4); border-radius: 6px; background: ButtonFace; color: ButtonText; cursor: pointer; }
      .sp-remove { margin-left: auto; border: none; background: none; color: inherit; opacity: 0.4; cursor: pointer; font-size: 16px; }
      .sp-remove:hover { opacity: 0.9; }
      .sp-remove.is-confirm { opacity: 1; color: #c0392b; font-size: 13px; font-weight: 600; }
      .sp-rule.is-invalid { background: rgba(192,57,43,0.14); border-left: 3px solid #c0392b; padding-left: 6px; }
      .sp-rule-flag { margin-left: 6px; font-size: 11px; padding: 0 6px; border-radius: 8px; background: rgba(128,128,128,0.2); }
      .sp-rule-flag.sp-rule-invalid { background: rgba(192,57,43,0.25); color: #c0392b; }
      .sp-rule-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
      .sp-rule-singleton { display: flex; align-items: center; gap: 4px; font-size: 12px; }
      .sp-rule-preview { margin: 6px 0; font-size: 13px; opacity: 0.85; max-width: 60ch; }
      .sp-rule-preview.is-confirm { color: #c0392b; opacity: 1; }
      .sp-rule-preview-line { margin: 2px 0; }
      .sp-rule-preview-ask { font-weight: 600; }
      .sp-status { margin-top: 28px; border-top: 1px solid rgba(128,128,128,0.25); padding-top: 12px; }
      .sp-status-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
      /* The click-wait row explains itself in full sentences (what happened, what the
         button does), so it wraps and its explanation takes a line of its own. */
      .sp-pause-row { flex-wrap: wrap; }
      .sp-pause-explain, .sp-pending-plan { flex-basis: 100%; max-width: 70ch; line-height: 1.45; }
      .sp-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; }
      .sp-dot.ok { background: #3aa657; }
      .sp-dot.stale { background: #d4a017; }
      .sp-dot.closed { background: #9aa0a6; }
      .sp-dot.never { background: #9aa0a6; }
      .sp-dot.rejected { background: #d64541; }
      /* The enroll banner reuses .sp-dot with its state as the class. Only the refused
         address gets a colour: it is the one state that is a SECURITY condition rather
         than a stage of a normal enrollment, so it must read as an alarm, not as
         "waiting". */
      .sp-dot.bad-address { background: #d64541; }
      .sp-offline { font-size: 12px; opacity: 0.7; margin-left: 8px; }
      .sp-fallback { font-size: 12px; color: #d64541; margin-top: 4px; }
    </style>
  </head>
  <body>
    <!-- Offline-first: this root is populated by the SFC-precompiled app; the very
         first paint uses only local sources (own tabs + cache), never the network. -->
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
